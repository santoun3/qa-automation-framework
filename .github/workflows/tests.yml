name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 11 * * *"   # nightly full regression, 5-6 AM Central
  workflow_dispatch:
    inputs:
      suite:
        description: "Which tests to run"
        type: choice
        options: [smoke, regression, all]
        default: all

jobs:
  test:
    name: ${{ matrix.suite }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [api, ui, playwright, security]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        if: matrix.suite == 'playwright' || matrix.suite == 'security'
        run: python -m playwright install --with-deps chromium

      - name: Pick test scope
        id: scope
        run: |
          # Pushes and PRs run the fast smoke set; nightly and manual runs go wider.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "marker=${{ matrix.suite }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.suite }}" != "all" ]; then
            echo "marker=${{ matrix.suite }} and ${{ inputs.suite }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "marker=${{ matrix.suite }}" >> "$GITHUB_OUTPUT"
          else
            echo "marker=${{ matrix.suite }} and smoke" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tests
        env:
          HEADLESS: "true"
        run: |
          pytest -m "${{ steps.scope.outputs.marker }}" \
            -n auto \
            --reruns 1 --reruns-delay 2 \
            --screenshot only-on-failure --tracing retain-on-failure \
            --output reports/playwright-artifacts \
            --junitxml=reports/junit-${{ matrix.suite }}.xml \
            --html=reports/report-${{ matrix.suite }}.html --self-contained-html

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-report-${{ matrix.suite }}
          path: reports/
          retention-days: 14

      - name: Publish summary
        if: always()
        run: |
          python - <<'EOF'
          import xml.etree.ElementTree as ET, os
          path = "reports/junit-${{ matrix.suite }}.xml"
          if os.path.exists(path):
              root = ET.parse(path).getroot()
              suite = root if root.tag == "testsuite" else root.find("testsuite")
              t, f, e, s = (int(suite.get(k, 0)) for k in ("tests", "failures", "errors", "skipped"))
              passed = t - f - e - s
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
                  out.write(f"### ${{ matrix.suite }} tests\n\n| Passed | Failed | Errors | Skipped |\n|---|---|---|---|\n| {passed} | {f} | {e} | {s} |\n")
          EOF

  zap-baseline:
    name: OWASP ZAP baseline scan
    runs-on: ubuntu-latest
    steps:
      # Passive scan only: ZAP crawls the public demo site and inspects responses
      # (headers, cookies, information leaks). It sends no attack traffic.
      - name: Run ZAP baseline scan
        run: |
          mkdir -p zap && chmod 777 zap
          docker run --rm -v "$PWD/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t https://www.saucedemo.com \
            -r zap-report.html -J zap-report.json -I

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: zap-baseline-report
          path: zap/
          retention-days: 14

      - name: Publish summary
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          path = "zap/zap-report.json"
          out = open(os.environ["GITHUB_STEP_SUMMARY"], "a")
          out.write("### OWASP ZAP baseline scan\n\n")
          if not os.path.exists(path):
              out.write("No report was produced.\n")
              raise SystemExit
          alerts = [a for site in json.load(open(path)).get("site", []) for a in site.get("alerts", [])]
          if not alerts:
              out.write("No findings.\n")
              raise SystemExit
          order = {"3": 0, "2": 1, "1": 2, "0": 3}
          out.write("| Risk | Finding | Instances |\n|---|---|---|\n")
          for a in sorted(alerts, key=lambda a: order.get(a.get("riskcode"), 9)):
              risk = a.get("riskdesc", "").split(" (")[0]
              out.write(f"| {risk} | {a.get('name')} | {a.get('count', len(a.get('instances', [])))} |\n")
          PY
