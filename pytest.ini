[pytest]
testpaths = tests
addopts = -ra --strict-markers
markers =
    ui: Selenium browser tests against the Sauce Demo web app
    playwright: Playwright browser tests against the Sauce Demo web app
    security: API and browser security tests (auth, authorization, injection)
    api: REST API tests against the Restful Booker service
    smoke: fast, critical-path checks run on every push
    regression: full suite run nightly and before release
